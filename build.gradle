plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base { archivesName = 'viavoice' }

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        'simple-voice-chat---multi-protocol' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
        if (project.hasProperty('protocolSmokeTest')) {
            'voicechat-protocol-verification' { sourceSet sourceSets.test }
        }
    }

    if (project.hasProperty('protocolSmokeTest')) {
        runs { client { source sourceSets.test } }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    clientImplementation "maven.modrinth:simple-voice-chat:${voicechat_version}"
}

processResources {
    def releaseVersion = project.version
    inputs.property 'version', releaseVersion
    filesMatching('fabric.mod.json') { expand version: releaseVersion }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach { options.release = 17 }

sourceSets.test.compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath

tasks.register('verifyProtocols', JavaExec) {
    description = 'Checks protocol framing, peer encryption and handshake state.'
    group = 'verification'
    dependsOn testClasses, clientClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.sallylabs.voicechat.testing.ProtocolVerification'
}

tasks.register('protocolSmokeTestJar', Jar) {
    description = 'Packages the development-only Fabric verification mod.'
    group = 'verification'
    dependsOn testClasses
    archiveFileName = 'protocol-smoke-test.jar'
    destinationDirectory = layout.buildDirectory.dir('testing')
    from sourceSets.test.output
}

check.dependsOn verifyProtocols

// The standalone harness runs through verifyProtocols, without a JUnit dependency.
tasks.named('test') { failOnNoDiscoveredTests = false }

if (project.hasProperty('protocolSmokeTest')) {
    tasks.named('runClient') { dependsOn testClasses }
}

jar { from 'LICENSE' }
tasks.named('sourcesJar') { from 'LICENSE' }
